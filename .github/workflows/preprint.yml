name: Build preprint

on:
  push:
    paths:
      - 'paper/main.tex'
      - '.github/workflows/preprint.yml'
  pull_request:
    paths:
      - 'paper/main.tex'
      - '.github/workflows/preprint.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install TeX and PDF inspection tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq latexmk texlive-latex-extra texlive-fonts-recommended poppler-utils
      - name: Compile and check the paper
        working-directory: paper
        run: |
          latexmk -pdf -halt-on-error -interaction=nonstopmode main.tex
          pdfinfo main.pdf
          pdffonts main.pdf
          if pdffonts main.pdf | awk 'NR > 2 && $(NF-4) != "yes" { bad=1 } END { exit !bad }'; then
            echo 'Every font in the PDF must be embedded.'
            exit 1
          fi
          if grep -E 'undefined citations|undefined references|Overfull \\hbox' main.log; then
            exit 1
          fi
      - name: Upload PDF and LaTeX source
        uses: actions/upload-artifact@v4
        with:
          name: karbench-preprint
          path: |
            paper/main.pdf
            paper/main.tex
          if-no-files-found: error
